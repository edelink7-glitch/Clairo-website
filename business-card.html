<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clairo Studios — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Screen preview ─── */
    body {
      background: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 48px;
      padding: 72px 48px;
    }

    .label {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: center;
      margin-bottom: 14px;
    }

    .print-note {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(224,212,188,0.35);
      text-align: center;
      margin-top: 56px;
      line-height: 2;
    }

    /* ─── Card base ───
       Screen: 700 × 400px (exactly 2× the 350 × 200pt print size)
       Print:  3.5in × 2in via @page override
    */
    .card {
      width: 700px;
      height: 400px;
      position: relative;
      overflow: hidden;
      border-radius: 1px;
    }

    /* ─── FRONT ─── */
    .card-front {
      background: #0B0B0B;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 4px 16px rgba(0,0,0,0.5);
    }

    .card-front::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    .front-inner {
      position: absolute;
      inset: 0;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }

    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-lockup img {
      height: 30px;
      width: auto;
    }

    .studio-name {
      font-family: 'Pathway Gothic One', sans-serif;
      font-size: 19px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .front-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(224,212,188,0.45);
    }

    .contact {
      text-align: right;
    }

    .contact p {
      font-family: 'DM Sans', sans-serif;
      font-size: 8.5px;
      font-weight: 300;
      letter-spacing: 0.14em;
      line-height: 2;
      color: rgba(255,255,255,0.30);
    }

    .contact .website {
      color: rgba(224,212,188,0.65);
    }

    /* Bone accent bar — bottom edge */
    .front-rule {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: linear-gradient(to right, transparent 5%, rgba(224,212,188,0.35) 35%, rgba(224,212,188,0.35) 65%, transparent 95%);
      z-index: 3;
    }

    /* ─── BACK ─── */
    .card-back {
      background: #E0D4BC;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3);
    }

    .back-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    #qrcode {
      line-height: 0;
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
      border: none;
    }

    .back-url {
      font-family: 'DM Sans', sans-serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(11,11,11,0.38);
    }

    .back-mark {
      position: absolute;
      bottom: 26px;
      right: 34px;
      opacity: 0.18;
    }

    .back-mark img {
      height: 18px;
      width: auto;
    }

    /* ─── Print ─── */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body {
        background: white;
        display: block;
        padding: 0;
        margin: 0;
        min-height: unset;
        gap: 0;
      }

      .label,
      .print-note { display: none; }

      /* Each card wrapper triggers a new 3.5"×2" page */
      .card-wrapper {
        page-break-after: always;
        break-after: page;
        display: block;
      }

      .card-wrapper:last-of-type {
        page-break-after: avoid;
        break-after: avoid;
      }

      @page {
        size: 3.5in 2in;
        margin: 0;
      }

      .card {
        width: 3.5in;
        height: 2in;
        border-radius: 0;
        box-shadow: none;
      }

      .front-inner {
        padding: 0.30in 0.35in;
      }

      .logo-lockup img   { height: 0.22in; }
      .studio-name       { font-size: 9.5pt; }
      .tagline           { font-size: 4.5pt; }
      .contact p         { font-size: 4.5pt; }
      .back-url          { font-size: 4pt; }
      .back-mark img     { height: 0.13in; }
    }
  </style>
</head>
<body>

  <!-- ── FRONT ── -->
  <div class="card-wrapper">
    <p class="label">Front</p>
    <div class="card card-front">
      <div class="front-inner">

        <div class="logo-lockup">
          <img src="White_Icon.png" alt="Clairo Studios mark" />
          <span class="studio-name">Clairo Studios</span>
        </div>

        <div class="front-bottom">
          <p class="tagline">Real Estate Media</p>
          <div class="contact">
            <p>hello@clairo.studio</p>
            <p class="website">clairo.studio</p>
          </div>
        </div>

      </div>
      <div class="front-rule"></div>
    </div>
  </div>

  <!-- ── BACK ── -->
  <div class="card-wrapper">
    <p class="label">Back</p>
    <div class="card card-back">
      <div class="back-inner">
        <div id="qrcode"></div>
        <p class="back-url">clairo.studio</p>
      </div>
      <div class="back-mark">
        <img src="Black_Icon.png" alt="" />
      </div>
    </div>
  </div>

  <p class="print-note">
    To print · File → Print → Paper size 3.5 × 2 in · Margins None · Scale 100%<br />
    Or export to PDF and send to your print shop at 300 DPI
  </p>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://clairo.studio",
      width: 116,
      height: 116,
      colorDark:  "#0B0B0B",
      colorLight: "#E0D4BC",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
