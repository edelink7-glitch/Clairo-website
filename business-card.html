<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clairo Studios — Business Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Screen Preview ── */
    body {
      background: #0e0e0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 80px;
      padding: 100px 48px;
      font-family: 'DM Sans', sans-serif;
    }

    .side-wrap { display: flex; flex-direction: column; align-items: center; }

    .side-label {
      font-size: 9px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.16);
      margin-bottom: 18px;
    }

    .print-hint {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.12);
      margin-top: 64px;
      text-align: center;
      line-height: 2.4;
    }

    /* ── Card Base: 700 × 400px = 2× the 350 × 200pt print size ── */
    .card {
      width: 700px;
      height: 400px;
      position: relative;
      overflow: hidden;
    }

    /* ════════════════════════════════════════
       FRONT
    ════════════════════════════════════════ */
    .card-front {
      background: #0B0B0B;
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.05),
        0 32px 80px rgba(0,0,0,0.9),
        0 8px 24px rgba(0,0,0,0.6);
    }

    /* Grain texture */
    .card-front::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 2;
    }

    /* Ghost display type — depth layer */
    .ghost-type {
      position: absolute;
      bottom: -24px;
      right: -10px;
      font-family: 'Pathway Gothic One', sans-serif;
      font-size: 268px;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.028);
      line-height: 1;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Thin left accent edge */
    .left-accent {
      position: absolute;
      left: 0;
      top: 52px;
      bottom: 52px;
      width: 1px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(224,212,188,0.30) 25%,
        rgba(224,212,188,0.30) 75%,
        transparent 100%
      );
      z-index: 3;
    }

    .front-content {
      position: absolute;
      inset: 0;
      padding: 50px 58px 50px 66px;
      display: flex;
      flex-direction: column;
      z-index: 3;
    }

    /* Logo lockup */
    .lockup {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .lockup img {
      height: 27px;
      width: auto;
      flex-shrink: 0;
    }

    .lockup-name {
      font-family: 'Pathway Gothic One', sans-serif;
      font-size: 17px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
    }

    .spacer { flex: 1; }

    /* Positioning line */
    .positioning {
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5px;
      font-weight: 300;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(224,212,188,0.38);
      margin-bottom: 18px;
    }

    /* Hairline rule */
    .rule {
      height: 0.5px;
      background: linear-gradient(
        to right,
        rgba(224,212,188,0.25) 0%,
        rgba(224,212,188,0.12) 70%,
        transparent 100%
      );
      margin-bottom: 18px;
    }

    /* Contact zone */
    .contact-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .name-block .name {
      font-family: 'DM Sans', sans-serif;
      font-size: 8.5px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      line-height: 1;
      margin-bottom: 5px;
    }

    .name-block .role {
      font-family: 'DM Sans', sans-serif;
      font-size: 7px;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(224,212,188,0.40);
      line-height: 1;
    }

    .contact-details {
      text-align: right;
    }

    .contact-details p {
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5px;
      font-weight: 300;
      letter-spacing: 0.10em;
      color: rgba(255,255,255,0.28);
      line-height: 2.0;
    }

    .contact-details .web {
      color: rgba(224,212,188,0.55);
    }

    /* ════════════════════════════════════════
       BACK
    ════════════════════════════════════════ */
    .card-back {
      background: #0B0B0B;
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.05),
        0 32px 80px rgba(0,0,0,0.9),
        0 8px 24px rgba(0,0,0,0.6);
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
      opacity: 0.038;
      pointer-events: none;
      z-index: 2;
    }

    /* Large ghost "C" for back depth */
    .ghost-back {
      position: absolute;
      top: -60px;
      left: -30px;
      font-family: 'Pathway Gothic One', sans-serif;
      font-size: 500px;
      letter-spacing: -0.05em;
      color: rgba(255,255,255,0.018);
      line-height: 1;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    .back-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 3;
    }

    .back-cta {
      font-family: 'DM Sans', sans-serif;
      font-size: 7px;
      font-weight: 400;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.20);
      margin-bottom: 2px;
    }

    /* QR container with hairline border */
    .qr-wrap {
      padding: 10px;
      border: 0.5px solid rgba(224,212,188,0.18);
      line-height: 0;
    }

    .qr-wrap img {
      display: block;
      image-rendering: pixelated;
    }

    .back-url {
      font-family: 'DM Sans', sans-serif;
      font-size: 7px;
      font-weight: 300;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: rgba(224,212,188,0.38);
      margin-top: 2px;
    }

    /* Logo watermark — bottom-right */
    .back-mark {
      position: absolute;
      bottom: 26px;
      right: 30px;
      z-index: 3;
    }

    .back-mark img {
      height: 20px;
      width: auto;
      opacity: 0.10;
    }

    /* ── Print ── */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body {
        background: white;
        display: block;
        padding: 0;
        margin: 0;
      }

      .side-label,
      .print-hint { display: none; }

      .side-wrap {
        page-break-after: always;
        break-after: page;
        display: block;
      }

      .side-wrap:last-of-type {
        page-break-after: avoid;
        break-after: avoid;
      }

      @page {
        size: 3.5in 2in;
        margin: 0;
      }

      .card {
        width: 3.5in;
        height: 2in;
        border-radius: 0;
        box-shadow: none;
      }

      .front-content    { padding: 0.29in 0.34in 0.29in 0.38in; }
      .lockup img       { height: 0.19in; }
      .lockup-name      { font-size: 8.5pt; }
      .positioning      { font-size: 3.8pt; letter-spacing: 0.22em; }
      .name-block .name { font-size: 4.3pt; }
      .name-block .role { font-size: 3.6pt; }
      .contact-details p { font-size: 3.8pt; }
      .ghost-type       { font-size: 1.6in; bottom: -0.14in; right: -0.06in; }
      .left-accent      { top: 0.30in; bottom: 0.30in; }
      .back-cta         { font-size: 3.5pt; }
      .back-url         { font-size: 3.5pt; }
      .back-mark img    { height: 0.13in; }
    }
  </style>
</head>
<body>

  <!-- ══ FRONT ══ -->
  <div class="side-wrap">
    <p class="side-label">Front</p>
    <div class="card card-front">
      <div class="left-accent"></div>
      <div class="front-content">

        <div class="lockup">
          <img src="White_Icon.png" alt="Clairo Studios" />
          <span class="lockup-name">Clairo Studios</span>
        </div>

        <div class="spacer"></div>

        <p class="positioning">Creative Systems &nbsp;·&nbsp; For Modern Brands</p>
        <div class="rule"></div>

        <div class="contact-row">
          <div class="name-block">
            <p class="name">Edelink Lorjuste</p>
            <p class="role">Founder</p>
          </div>
          <div class="contact-details">
            <p>edelink7@gmail.com</p>
            <p class="web">clairo.studio</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ══ BACK ══ -->
  <div class="side-wrap">
    <p class="side-label">Back</p>
    <div class="card card-back">
      <div class="back-content">
        <p class="back-cta">See Our Work</p>
        <div class="qr-wrap">
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=112x112&data=https%3A%2F%2Fclairo.studio&bgcolor=0B0B0B&color=E0D4BC&margin=0"
            width="112" height="112"
            alt="QR — clairo.studio"
          />
        </div>
        <p class="back-url">clairo.studio</p>
      </div>
      <div class="back-mark">
        <img src="White_Icon.png" alt="" />
      </div>
    </div>
  </div>

  <p class="print-hint">
    File → Print &nbsp;·&nbsp; Paper size 3.5 × 2 in &nbsp;·&nbsp; Margins: None &nbsp;·&nbsp; Scale: 100%<br />
    Or export to PDF and send to your print shop — specify 300 DPI
  </p>

</body>
</html>
